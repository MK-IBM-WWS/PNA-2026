<!DOCTYPE html>
<html>

<head>
  <title>Калькулятор</title>
  <link rel="stylesheet" href="styles/style.css">
  <script type="text/javascript" src="scripts/calculator.js" defer></script> 
</head>

<body>

      <div class="top-border">
      <div class="border-content">
        <div class="border-buttons">
          <a href="index.html" class="border-btn"><img src="styles/images/label.jpg" alt="Информация" class="owl-icon"></a>
          
          <input type="checkbox" id="theme-switch" class="theme-switch">
          <label for="theme-switch" class="border-btn theme-label">
            <span class="dark-icon">🌙</span>
            <span class="light-icon">☀️</span>
          </label>
        </div>
      </div>
    </div>

  <div class="main-object">
    <div id="result" class="result">
      0
    </div>

    <div>
      <div>
        <button id="btn_op_clear" class="my-btn secondary">C</button>
        <button id="btn_op_ce" class="my-btn secondary">CE</button>
        <button id="btn_op_log" class="my-btn secondary">log</button>
        <button id="btn_op_power" class="my-btn primary">x²</button>
        <button id="btn_op_factorial" class="my-btn primary">x!</button>
      </div>

      <div>  
        <button id="btn_op_sqrt" class="my-btn secondary">√</button>
        <button id="btn_op_sign" class="my-btn secondary">+/-</button>
        <button id="btn_op_percent" class="my-btn secondary">%</button>
        <button id="btn_op_div" class="my-btn primary">/</button>
        <button id="btn_op_add_zeroes" class="my-btn primary">000</button>
      </div>

      <div>
        <button id="btn_digit_7"  class="my-btn">7</button>
        <button id="btn_digit_8"  class="my-btn">8</button>
        <button id="btn_digit_9"  class="my-btn">9</button>
        <button id="btn_op_mult" class="my-btn primary">x</button>
        <button id="btn_op_cumulative_sum" class="my-btn primary">S</button>
      </div>

      <div>
        <button id="btn_digit_4"  class="my-btn">4</button>
        <button id="btn_digit_5"  class="my-btn">5</button>
        <button id="btn_digit_6"  class="my-btn">6</button>
        <button id="btn_op_minus" class="my-btn primary">-</button>
        <button id="btn_op_cumulative_minus" class="my-btn primary">M</button>
      </div>

      <div>
        <button id="btn_digit_1"  class="my-btn">1</button>
        <button id="btn_digit_2"  class="my-btn">2</button>
        <button id="btn_digit_3"  class="my-btn">3</button>
        <button id="btn_op_plus" class="my-btn primary">+</button>
        <button id="btn_change_screen_color" class="my-btn primary">BC</button>
      </div>

      <div>
        <button id="btn_digit_0"  class="my-btn">0</button>
        <button id="btn_digit_dot" class="my-btn">.</button>
        <button id="btn_op_equal" class="my-btn primary execute">=</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-top">
      <span class="logo"><img src="styles/images/label.jpg" alt="Информация" class="owl-icon"></span>
  </div>
  <br>
  <div class="footer-container">
    <div class="footer-col">
      <h4>О проекте</h4>
      <ul>
        <li><a href="#">О калькуляторе</a></li>
        <li><a href="#">Возможности</a></li>
        <li><a href="delta.html">Технологии</a></li>
      </ul>
    </div>
    <div class="footer-col">
      <h4>Разработчик</h4>
      <ul>
        <li><a href="info.html">О разработчике</a></li>
        <li><a href="#">О комманде</a></li>
        <li><a href="#">О компании</a></li>
      </ul>
    </div>
    <div class="footer-col">
      <h4>Документация</h4>
      <ul>
        <li><a href="#">Инструкция</a></li>
        <li><a href="#">История версий</a></li>
        <li><a href="#">Лицензия</a></li>
      </ul>
    </div>
    <div class="footer-col">
      <h4>Контакты</h4>
      <ul>
        <li><a href="#">Telegram</a></li>
        <li><a href="#">Email</a></li>
        <li><a href="https://github.com/MK-IBM-WWS/PNA-2026/blob/calculator_frontend">GitHub</a></li>

    </div>
  </div>

    <p>© 2026 Калькулятор. Все права защищены.</p>
  </div>
</footer>

</html>
